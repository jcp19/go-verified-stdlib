name: Gobra

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Gobra runs in config file mode: all of its options come from
      # src/gobra-mod.json (module-wide) and the per-package gobra.json files.
      #
      # The Gobra image also supplies Z3. `sort` and `container/list` verify
      # on the Z3 that `latest` currently ships (4.16.0). `internal/bytealg`
      # does not verify reliably on it -- expect this workflow to fail on that
      # package roughly one run in three, in IndexRabinKarpBytes, which sits on
      # its assert budget. See src/gobra/TOOLCHAIN.md and
      # src/internal/bytealg/GOBRA.md.
      - name: Verify package sort
        uses: viperproject/gobra-action@main
        with:
          configFile: 'src/sort'
          timeout: 1h

      # Note: the action's default javaXss is 1g, which is also the maximum
      # the image's JVM accepts ("exceeds the maximum representable size" for
      # anything larger), so the stack size is left at its default.
      - name: Verify package internal/bytealg
        uses: viperproject/gobra-action@main
        with:
          configFile: 'src/internal/bytealg'
          timeout: 1h

      - name: Verify package container/list
        uses: viperproject/gobra-action@main
        with:
          configFile: 'src/container/list'
          timeout: 1h
